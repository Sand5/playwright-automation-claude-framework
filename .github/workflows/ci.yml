name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_env:
        description: Environment to test (loads env/.env.<value>)
        type: choice
        options: [qa, staging]
        default: qa

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Typecheck, lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:check

  e2e:
    name: Playwright (${{ matrix.project }})
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      # push/PR runs have no input, so they default to qa.
      TEST_ENV: ${{ inputs.test_env || 'qa' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Generate specs from feature files
        run: npm run bddgen
      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          # Optional: if the secrets are not set these are empty and the
          # demo fallback in test-data/login-data.ts is used.
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
      - name: Generate Cucumber HTML report
        if: ${{ !cancelled() }}
        run: npm run report:cucumber
        env:
          REPORT_PROJECT: ${{ matrix.project }}
      - name: Upload Cucumber HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.project }}
          path: cucumber-report/html/
          retention-days: 14
